[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#ffffff"
font = "sans serif"

[server]
runOnSave = true
# No port here: Streamlit Community Cloud health-checks 8501 and fails to
# start the app on any other. Locally, pass the port on the command line
# (see app.py).

[browser]
gatherUsageStats = false
